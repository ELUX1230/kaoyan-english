<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研英通 - 考研英语二真题精学平台</title>
    <style>
        :root {
            --bg: #f6f7f9;
            --card-bg: #ffffff;
            --primary: #4f46e5;
            --primary-light: #eef2ff;
            --primary-dark: #3730a3;
            --text: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --popover-bg: #1e293b;
            --popover-text: #f8fafc;
            --highlight: #fef08a;
            --sentence-hover: #f1f5f9;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
            --shadow-xl: 0 20px 50px -10px rgba(0, 0, 0, 0.2);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .navbar { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 0 24px; height: 64px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-sm); }
        .navbar-brand { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; color: var(--primary); cursor: pointer; }
        .navbar-brand .logo-icon { width: 34px; height: 34px; background: var(--primary); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; font-weight: 800; }
        .navbar-tabs { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: var(--radius-md); }
        .navbar-tab { padding: 6px 14px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-secondary); border: none; background: transparent; transition: all 0.2s; white-space: nowrap; }
        .navbar-tab:hover { color: var(--text); }
        .navbar-tab.active { background: var(--card-bg); color: var(--primary); box-shadow: var(--shadow-sm); }
        .navbar-right { display: flex; align-items: center; gap: 10px; }
        .nav-btn { padding: 6px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--card-bg); cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
        .nav-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
        .nav-btn .badge { background: var(--danger); color: #fff; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; display: flex; align-items: center; justify-content: center; font-weight: 700; }

        .main-container { display: flex; max-width: 1400px; margin: 0 auto; padding: 20px; gap: 20px; min-height: calc(100vh - 64px); }
        
        .sidebar { width: 280px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px; position: sticky; top: 84px; height: fit-content; }
        .sidebar-card { background: var(--card-bg); border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 16px; box-shadow: var(--shadow-sm); }
        .sidebar-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: var(--text); display: flex; align-items: center; gap: 8px; }
        .year-selector { display: flex; flex-wrap: wrap; gap: 6px; max-height: 180px; overflow-y: auto; padding-bottom: 4px; }
        .year-btn { padding: 5px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--card-bg); cursor: pointer; font-size: 12px; font-weight: 600; color: var(--text-secondary); transition: all 0.15s; }
        .year-btn:hover { border-color: var(--primary); color: var(--primary); }
        .year-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .article-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
        .article-item { padding: 9px 12px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-secondary); transition: all 0.2s; border-left: 3px solid transparent; }
        .article-item:hover { background: var(--primary-light); color: var(--primary); }
        .article-item.active { background: var(--primary-light); color: var(--primary); border-left-color: var(--primary); font-weight: 600; }

        .content-area { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
        .reading-panel { background: var(--card-bg); border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 24px 28px; box-shadow: var(--shadow-sm); }
        .reading-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
        .reading-title { font-size: 18px; font-weight: 700; color: var(--text); }
        .reading-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
        .meta-tag { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; background: var(--bg); color: var(--text-secondary); }
        
        .mode-switch { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: var(--radius-md); margin-bottom: 16px; }
        .mode-btn { padding: 6px 12px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; cursor: pointer; border: none; background: transparent; color: var(--text-secondary); transition: all 0.2s; }
        .mode-btn.active { background: var(--card-bg); color: var(--primary); box-shadow: var(--shadow-sm); }
        
        .paragraph { margin-bottom: 20px; }
        .paragraph-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
        .sentence-block { padding: 8px 12px; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.15s; border-left: 2px solid transparent; margin-bottom: 6px; }
        .sentence-block:hover { background: var(--sentence-hover); border-left-color: var(--primary); }
        .sentence-block.active { background: var(--primary-light); border-left-color: var(--primary); }
        .sentence-text { font-size: 15px; color: var(--text); line-height: 1.8; }
        .sentence-translation { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-top: 4px; padding-left: 8px; border-left: 2px dashed var(--border); }
        
        .clickable-word { cursor: pointer; border-bottom: 1.5px solid transparent; transition: all 0.15s; border-radius: 2px; }
        .clickable-word:hover { background: var(--highlight); border-bottom-color: var(--warning); }
        .clickable-word.highlighted { background: var(--highlight); border-bottom-color: var(--warning); font-weight: 600; }
        
        .word-popover { position: fixed; z-index: 1000; background: var(--popover-bg); color: var(--popover-text); border-radius: var(--radius-md); padding: 14px 16px; box-shadow: var(--shadow-xl); width: 300px; font-size: 13px; }
        .word-popover .word-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
        .word-popover .word-title { font-size: 18px; font-weight: 700; color: #fff; }
        .word-popover .word-phonetic { font-size: 12px; color: #cbd5e1; }
        .word-popover .word-pos { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; background: var(--primary); color: #fff; margin-right: 4px; }
        .word-popover .word-meaning { font-size: 13px; color: #e2e8f0; line-height: 1.5; margin-bottom: 6px; }
        .popover-btn { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; cursor: pointer; border: none; }
        .popover-btn.add-word { background: var(--success); color: #fff; margin-right: 6px; }
        .popover-btn.close-pop { background: rgba(255,255,255,0.2); color: #fff; }

        .analysis-panel { background: var(--card-bg); border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 20px 24px; box-shadow: var(--shadow-sm); }
        .analysis-panel h3 { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
        .sentence-tree { display: flex; flex-direction: column; gap: 6px; padding: 10px; background: var(--bg); border-radius: var(--radius-md); }
        .tree-level { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .tree-label { font-size: 11px; font-weight: 700; color: var(--text-muted); min-width: 45px; }
        .tree-token { padding: 3px 8px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; }
        .tree-token.subject { background: #dbeafe; color: #1e40af; }
        .tree-token.verb { background: #fee2e2; color: #991b1b; }
        .tree-token.object { background: #d1fae5; color: #065f46; }
        .tree-token.modifier { background: #ede9fe; color: #5b21b6; }

        .right-panel { width: 240px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px; position: sticky; top: 84px; height: fit-content; }
        .right-card { background: var(--card-bg); border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 14px; box-shadow: var(--shadow-sm); }
        .right-card h4 { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
        .wordbook-list { list-style: none; display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; }
        .wordbook-item { display: flex; align-items: center; justify-content: space-between; padding: 5px 6px; border-radius: var(--radius-sm); font-size: 12px; }
        .wordbook-item:hover { background: var(--bg); }
        .remove-word-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; }
        .remove-word-btn:hover { color: var(--danger); }

        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 6px; }
        .toast { padding: 10px 14px; border-radius: var(--radius-md); font-size: 13px; font-weight: 500; box-shadow: var(--shadow-lg); color: #fff; }
        .toast.success { background: #065f46; }
        .toast.info { background: #1e40af; }
        .toast.warning { background: #92400e; }
        .toast.danger { background: #991b1b; }
        
        @media (max-width: 1100px) { .right-panel { display: none; } }
        @media (max-width: 800px) { .sidebar { display: none; } .main-container { padding: 10px; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand" onclick="showToast('info', '研英通已就绪！')">
            <div class="logo-icon">研</div>
            <span>研英通</span>
        </div>
        <div class="navbar-tabs">
            <button class="navbar-tab active">📖 真题精读</button>
            <button class="navbar-tab" onclick="showToast('info', '写作与试题库迭代中')">📝 试题分析</button>
        </div>
        <div class="navbar-right">
            <button class="nav-btn">🔖 生词本 <span class="badge" id="wordbook-badge">0</span></button>
        </div>
    </nav>

    <div class="main-container">
        <aside class="sidebar">
            <div class="sidebar-card">
                <h3>📅 年份选择</h3>
                <div class="year-selector" id="year-selector"></div>
            </div>
            <div class="sidebar-card">
                <h3>📄 真题篇目</h3>
                <ul class="article-list" id="article-list"></ul>
            </div>
        </aside>

        <main class="content-area">
            <div class="reading-panel">
                <div class="reading-header">
                    <div>
                        <div class="reading-title" id="reading-title">真题加载中...</div>
                        <div class="reading-meta">
                            <span class="meta-tag" id="word-count">📊 统计中</span>
                        </div>
                    </div>
                    <button class="nav-btn" onclick="toggleTranslation()">🔤 译文开关</button>
                </div>
                <div class="mode-switch">
                    <button class="mode-btn active" onclick="switchMode(this, 'bilingual')">中英对照</button>
                    <button class="mode-btn" onclick="switchMode(this, 'original')">纯英文</button>
                    <button class="mode-btn" onclick="switchMode(this, 'translation')">纯译文</button>
                </div>
                <div id="article-content"></div>
            </div>

            <div class="analysis-panel">
                <h3>🔬 长难句成分拆解</h3>
                <div id="sentence-analysis"></div>
            </div>
        </main>

        <aside class="right-panel">
            <div class="right-card">
                <h4>🔖 我的生词本</h4>
                <ul class="wordbook-list" id="wordbook-list">
                    <li style="text-align:center; color:var(--text-muted); font-size:12px; padding:12px;">点击文章单词添加生词</li>
                </ul>
            </div>
        </aside>
    </div>

    <div class="word-popover" id="word-popover" style="display: none;" onclick="event.stopPropagation();">
        <div class="word-head">
            <span class="word-title" id="pop-word">word</span>
            <span class="word-phonetic" id="pop-phonetic"></span>
        </div>
        <div id="pop-meanings"></div>
        <div style="margin-top: 10px;">
            <button class="popover-btn add-word" onclick="addToWordbook()">+ 生词本</button>
            <button class="popover-btn close-pop" onclick="closePopover()">关闭</button>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script>
        // 1. 全部真题文件名列表 (自动按年份关联，不含 .json 后缀)
        const fileNames = [
            "考研英语（旧）2006年真题及答案解析（整卷）",
            "考研英语（旧）2007年真题及答案解析（整卷）",
            "考研英语（旧）2008年真题及答案解析（整卷）",
            "考研英语（旧）2009年真题及答案解析（整卷）",
            "考研英语二2010年真题及答案解析（整卷）",
            "考研英语二2011年真题及答案解析（整卷）",
            "考研英语二2012年真题及答案解析（整卷）",
            "考研英语二2013年真题及答案解析（整卷）",
            "考研英语二2014年真题及答案解析（整卷）",
            "考研英语二2015年真题及答案解析（整卷）",
            "考研英语二2016年真题及答案解析（整卷）",
            "考研英语二2017年真题及答案解析（整卷）",
            "考研英语二2018年真题及答案解析（整卷）",
            "考研英语二2019年真题及答案解析（整卷）",
            "考研英语二2020年真题及答案解析（整卷）",
            "考研英语二2021年真题及答案解析（整卷）",
            "考研英语二2022年真题及答案解析（整卷）",
            "考研英语二2023年真题及答案解析（整卷）",
            "考研英语二2024年真题及答案解析（整卷）",
            "考研英语二2025年真题及答案解析（整卷）",
            "考研英语二2026年真题及答案解析（整卷）"
        ];

        const mockArticles = fileNames.map((filename, index) => {
            const yearMatch = filename.match(/\d{4}/);
            const year = yearMatch ? parseInt(yearMatch[0]) : 2010;
            return { id: index + 1, year: year, title: filename, filename: filename };
        });

        const state = {
            currentArticleId: 1,
            currentYear: mockArticles[0].year,
            translationOn: true,
            mode: 'bilingual',
            wordbook: [],
            selectedSentenceId: null,
            selectedWord: null,
            popoverVisible: false,
        };

        let currentArticleData = null;

        function showToast(type, msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        // 2. 动态健壮加载 JSON
        async function selectArticle(id) {
            state.currentArticleId = id;
            state.selectedSentenceId = null;
            const article = mockArticles.find(a => a.id === id);
            if (!article) return;

            showToast('info', `加载 ${article.year} 真题...`);

            // 自动兼容两种路径与 URL 编码
            const pathsToTry = [
                `data/${encodeURIComponent(article.filename)}.json`,
                `./data/${encodeURIComponent(article.filename)}.json`,
                `${encodeURIComponent(article.filename)}.json`,
                `data/${article.filename}.json`
            ];

            let loaded = false;
            for (let path of pathsToTry) {
                try {
                    const res = await fetch(path);
                    if (res.ok) {
                        currentArticleData = await res.json();
                        loaded = true;
                        break;
                    }
                } catch (e) {}
            }

            if (loaded) {
                renderArticleList();
                renderArticle();
                renderAnalysis();
                closePopover();
            } else {
                showToast('danger', '读取失败：请确认 GitHub 仓库已创建 data 文件夹并放入 JSON');
                document.getElementById('article-content').innerHTML = `
                    <div style="text-align:center; padding: 40px; color: var(--danger);">
                        <p style="font-weight:700;">真题文件读取失败</p>
                        <p style="font-size:12px; color:var(--text-muted); margin-top:8px;">请确认仓库已存在 data/${article.filename}.json</p>
                    </div>`;
            }
        }

        function renderYearSelector() {
            const years = [...new Set(mockArticles.map(a => a.year))].sort((a, b) => b - a);
            const container = document.getElementById('year-selector');
            container.innerHTML = years.map(year =>
                `<button class="year-btn ${year === state.currentYear ? 'active' : ''}" onclick="selectYear(${year})">${year}</button>`
            ).join('');
        }

        function selectYear(year) {
            state.currentYear = year;
            renderYearSelector();
            renderArticleList();
            const firstOfCurrentYear = mockArticles.find(a => a.year === year);
            if (firstOfCurrentYear) selectArticle(firstOfCurrentYear.id);
        }

        function renderArticleList() {
            const filtered = mockArticles.filter(a => a.year === state.currentYear);
            const container = document.getElementById('article-list');
            container.innerHTML = filtered.map(a => 
                `<li class="article-item ${a.id === state.currentArticleId ? 'active' : ''}" onclick="selectArticle(${a.id})">
                    ${a.title}
                </li>`
            ).join('');
        }

        // 3. 渲染文章与分词
        function renderArticle() {
            if (!currentArticleData) return;
            document.getElementById('reading-title').textContent = currentArticleData.title;
            
            let totalWords = 0;
            currentArticleData.paragraphs.forEach(p => p.sentences.forEach(s => totalWords += (s.tokens || []).length));
            document.getElementById('word-count').textContent = `📊 约 ${totalWords} 词`;

            const contentDiv = document.getElementById('article-content');
            contentDiv.innerHTML = '';

            currentArticleData.paragraphs.forEach((para) => {
                const paraDiv = document.createElement('div');
                paraDiv.className = 'paragraph';

                const label = document.createElement('div');
                label.className = 'paragraph-label';
                label.textContent = `📑 ${para.label || para.paragraph_id}`;
                paraDiv.appendChild(label);

                // 获取该段落的首句翻译作为段落备用译文
                const fallbackParaTrans = (para.sentences[0] && para.sentences[0].translation) ? para.sentences[0].translation : '';

                para.sentences.forEach((sent) => {
                    const sentDiv = document.createElement('div');
                    sentDiv.className = `sentence-block ${sent.id === state.selectedSentenceId ? 'active' : ''}`;
                    sentDiv.id = `sentence-${sent.id}`;
                    
                    sentDiv.onclick = (e) => {
                        if (e.target.classList.contains('clickable-word')) return;
                        state.selectedSentenceId = sent.id;
                        document.querySelectorAll('.sentence-block').forEach(el => el.classList.remove('active'));
                        sentDiv.classList.add('active');
                        renderAnalysis();
                    };

                    const textDiv = document.createElement('div');
                    textDiv.className = 'sentence-text';
                    
                    if (state.mode === 'original' || state.mode === 'bilingual') {
                        let tokensHtml = '';
                        (sent.tokens || []).forEach(token => {
                            if (!token.is_punct) {
                                tokensHtml += `<span class="clickable-word" onclick="wordClick(event, '${token.lemma || token.word}')">${token.word}</span>${token.space_after || ' '}`;
                            } else {
                                tokensHtml += `${token.word}${token.space_after || ''}`;
                            }
                        });
                        textDiv.innerHTML = tokensHtml;
                    }
                    sentDiv.appendChild(textDiv);

                    // 翻译显示逻辑：有单句译文显示单句，无单句译文在段落首句展示完整译文
                    const transText = sent.translation || (sent.id.endsWith('_1') ? fallbackParaTrans : '');
                    if (state.translationOn && transText && (state.mode === 'bilingual' || state.mode === 'translation')) {
                        const transDiv = document.createElement('div');
                        transDiv.className = 'sentence-translation';
                        transDiv.textContent = '💡 ' + transText;
                        sentDiv.appendChild(transDiv);
                    }

                    paraDiv.appendChild(sentDiv);
                });
                contentDiv.appendChild(paraDiv);
            });
        }

        // 4. 自动基于 NLP Token 提取主谓宾语法树
        function renderAnalysis() {
            const container = document.getElementById('sentence-analysis');
            if (!state.selectedSentenceId) {
                container.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:14px;">👆 点击上方句子即可查看语法结构拆解</div>';
                return;
            }

            let foundSent = null;
            if (currentArticleData) {
                for (let p of currentArticleData.paragraphs) {
                    for (let s of p.sentences) {
                        if (s.id === state.selectedSentenceId) { foundSent = s; break; }
                    }
                }
            }
            if (!foundSent) return;

            // 基于 POS 词性自动分类
            const subjects = [], verbs = [], objects = [], modifiers = [];
            (foundSent.tokens || []).forEach(t => {
                if (['NOUN', 'PROPN', 'PRON'].includes(t.pos)) {
                    if (verbs.length === 0) subjects.push(t.word);
                    else objects.push(t.word);
                } else if (['VERB', 'AUX'].includes(t.pos)) {
                    verbs.push(t.word);
                } else if (['ADJ', 'ADV'].includes(t.pos)) {
                    modifiers.push(t.word);
                }
            });

            let html = `<div style="font-size:14px;font-weight:600;margin-bottom:8px;">原句：${foundSent.text}</div><div class="sentence-tree">`;
            if (subjects.length) html += `<div class="tree-level"><span class="tree-label">主语核心</span>${subjects.slice(0, 3).map(s => `<span class="tree-token subject">${s}</span>`).join('')}</div>`;
            if (verbs.length) html += `<div class="tree-level"><span class="tree-label">谓语动词</span>${verbs.slice(0, 3).map(s => `<span class="tree-token verb">${s}</span>`).join('')}</div>`;
            if (objects.length) html += `<div class="tree-level"><span class="tree-label">宾语/表语</span>${objects.slice(0, 3).map(s => `<span class="tree-token object">${s}</span>`).join('')}</div>`;
            if (modifiers.length) html += `<div class="tree-level"><span class="tree-label">修饰词</span>${modifiers.slice(0, 5).map(s => `<span class="tree-token modifier">${s}</span>`).join('')}</div>`;
            html += `</div>`;

            container.innerHTML = html;
        }

        // 5. 实时在线词典 API
        async function wordClick(event, word) {
            event.stopPropagation();
            state.selectedWord = word;
            
            const pop = document.getElementById('word-popover');
            document.getElementById('pop-word').textContent = word;
            document.getElementById('pop-phonetic').textContent = '查询中...';
            document.getElementById('pop-meanings').innerHTML = '<div style="color:#cbd5e1;">正在检索词义...</div>';
            
            pop.style.left = `${Math.min(event.clientX + 10, window.innerWidth - 320)}px`;
            pop.style.top = `${Math.min(event.clientY + 10, window.innerHeight - 200)}px`;
            pop.style.display = 'block';
            state.popoverVisible = true;

            try {
                const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
                if (!res.ok) throw new Error();
                const data = await res.json();
                const entry = data[0];
                
                document.getElementById('pop-phonetic').textContent = entry.phonetic || (entry.phonetics[0] ? entry.phonetics[0].text : '') || '';
                let meaningsHtml = '';
                entry.meanings.slice(0, 2).forEach(m => {
                    const def = m.definitions[0] ? m.definitions[0].definition : '';
                    meaningsHtml += `<div style="margin-bottom:4px;"><span class="word-pos">${m.partOfSpeech}</span><span>${def}</span></div>`;
                });
                document.getElementById('pop-meanings').innerHTML = meaningsHtml;
            } catch (err) {
                document.getElementById('pop-phonetic').textContent = '';
                document.getElementById('pop-meanings').innerHTML = '<div style="color:#cbd5e1;">未在在线词典检索到该词详细释义</div>';
            }
        }

        function closePopover() {
            document.getElementById('word-popover').style.display = 'none';
            state.popoverVisible = false;
        }

        function addToWordbook() {
            if (!state.selectedWord) return;
            if (!state.wordbook.includes(state.selectedWord)) {
                state.wordbook.push(state.selectedWord);
                document.getElementById('wordbook-badge').textContent = state.wordbook.length;
                renderWordbook();
                showToast('success', `已添加 "${state.selectedWord}"`);
            }
            closePopover();
        }

        function renderWordbook() {
            const list = document.getElementById('wordbook-list');
            if (!state.wordbook.length) {
                list.innerHTML = '<li style="text-align:center; color:var(--text-muted); font-size:12px; padding:12px;">点击文章单词添加生词</li>';
                return;
            }
            list.innerHTML = state.wordbook.map((w, i) => `
                <li class="wordbook-item">
                    <span>${w}</span>
                    <button class="remove-word-btn" onclick="removeWord(${i})">×</button>
                </li>
            `).join('');
        }

        function removeWord(i) {
            state.wordbook.splice(i, 1);
            document.getElementById('wordbook-badge').textContent = state.wordbook.length;
            renderWordbook();
        }

        function switchMode(btn, mode) {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            state.mode = mode;
            renderArticle();
        }

        function toggleTranslation() {
            state.translationOn = !state.translationOn;
            renderArticle();
        }

        function init() {
            renderYearSelector();
            renderArticleList();
            if (mockArticles.length > 0) selectArticle(mockArticles[0].id);

            document.addEventListener('click', (e) => {
                if (state.popoverVisible && !e.target.closest('.word-popover') && !e.target.closest('.clickable-word')) {
                    closePopover();
                }
            });
        }

        init();
    </script>
</body>
</html>
